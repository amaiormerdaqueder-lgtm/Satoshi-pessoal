
name: Monitor de oportunidades

on:
  workflow_dispatch:
  schedule:
    - cron: '37 12 * * *'

permissions:
  contents: read

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Executar monitor
        run: python monitor_oportunidades.py

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-oportunidades
          path: relatorios/oportunidades.json
          if-no-files-found: warn
          retention-days: 30
