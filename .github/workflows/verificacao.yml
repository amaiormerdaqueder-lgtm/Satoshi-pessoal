name: Verificacao do Satoshi Pessoal

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Registrar execucao
        run: echo "Verificacao do Satoshi Pessoal executada em $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Preparar registro de oportunidades
        run: |
          mkdir -p registros
          if [ ! -f registros/oportunidades.csv ]; then
            echo "data,plataforma,tipo_recompensa,recompensa_obtida,tempo_minutos,valor_minimo_saque,taxas,observacoes" > registros/oportunidades.csv
          fi
          echo "Registro preparado em $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> registros/verificacoes.txt

      - name: Salvar registro como artefato
        uses: actions/upload-artifact@v4
        with:
          name: registro-satoshi-pessoal
          path: registros/
